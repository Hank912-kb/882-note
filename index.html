<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Web 筆記</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1d2229;
    --line: #2e3540;
    --text: #e8ecf1;
    --dim: #8b96a5;
    --key-bg: #ffd84d;
    --key-fg: #1a1400;
    --val: #5fd7ff;
    --cmt: #7c8a78;
    --accent: #ffd84d;
    --fs-code: clamp(18px, 2.1vw, 24px);
    --fs-body: clamp(18px, 2vw, 22px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: var(--fs-body); line-height: 1.5;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  /* ---------- 主頁 ---------- */
  #home {
    height: 100dvh; display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    gap: 12px;
  }
  #home header { display: flex; align-items: center; justify-content: space-between; }
  #home h1 { margin: 0; font-size: clamp(20px, 2.6vw, 30px); letter-spacing: .04em; }
  #hand {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; font-size: 16px; color: var(--dim); min-height: 44px;
  }
  #grid {
    flex: 1; min-height: 0; display: grid; gap: 12px;
    grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr);
  }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    border-left: 8px solid var(--c);
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    padding: 10px 16px; text-align: left; min-height: 84px;
    transition: transform .08s, background .08s;
  }
  .tile:active { transform: scale(.97); background: #262d36; }
  .tile b { font-size: clamp(20px, 2.5vw, 32px); line-height: 1.2; }
  .tile span { font-size: clamp(14px, 1.5vw, 18px); color: var(--dim); margin-top: 6px; }
  #rotate { display: none; text-align: center; color: var(--dim); font-size: 15px; }

  @media (orientation: portrait) {
    #home { height: auto; min-height: 100dvh; }
    #grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: none; grid-auto-rows: 110px; }
    #rotate { display: block; }
  }

  /* ---------- 單元頁 ---------- */
  #unit {
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             120px max(16px, env(safe-area-inset-left));
  }
  #uHead { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 20px; margin-bottom: 12px; }
  #uHead h2 {
    margin: 0; font-size: clamp(24px, 3vw, 36px);
    border-left: 8px solid var(--c, var(--accent)); padding-left: 14px;
  }
  #uHead h2 small { font-size: .55em; color: var(--dim); font-weight: 400; margin-left: 12px; }
  #sections { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; min-width: 0; }
  .card h3 { margin: 0 0 8px; font-size: clamp(19px, 2.2vw, 25px); color: var(--accent); }
  pre {
    margin: 0; padding: 12px 14px; background: #0f1216; border-radius: 12px;
    font: calc(var(--fs-code) * var(--zoom, 1))/1.55 "SF Mono", Menlo, Consolas, monospace;
    overflow-x: auto; white-space: pre; tab-size: 2;
  }
  .k { background: var(--key-bg); color: var(--key-fg); border-radius: 5px; padding: 0 4px; font-weight: 700; }
  .v { color: var(--val); font-weight: 700; }
  .c { color: var(--cmt); }
  .c .k { opacity: .9; }
  ul.notes { margin: 10px 0 0; padding-left: 1.2em; }
  ul.notes li { margin: 4px 0; }
  ul.notes .k, ul.notes .v { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .95em; }
  .legend { color: var(--dim); font-size: 15px; margin: 0; }

  /* ---------- 浮動操作鈕（拇指區） ---------- */
  #fab {
    position: fixed; bottom: max(14px, env(safe-area-inset-bottom));
    right: max(14px, env(safe-area-inset-right));
    display: flex; gap: 10px; align-items: center; z-index: 10;
  }
  body.left #fab { right: auto; left: max(14px, env(safe-area-inset-left)); flex-direction: row-reverse; }
  #fab button {
    height: 64px; min-width: 64px; border-radius: 32px;
    background: #2b333e; border: 1px solid #465060;
    font-size: 26px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  #fab #goHome { background: var(--accent); color: #1a1400; border-color: var(--accent); padding: 0 26px; font-size: 22px; }
  #fab button:active { transform: scale(.94); }
  #zoom { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #zoom button { background: #2b333e; border: 1px solid #465060; border-radius: 10px; min-width: 48px; height: 36px; font-size: 16px; font-weight: 700; }
  #zoom button:active { transform: scale(.94); }
  #zoom b { font-size: 12px; color: var(--dim); min-width: 40px; text-align: center; font-weight: 400; }
  [hidden] { display: none !important; }
  /* ---------- 手機橫式（iPhone 16：852×393） ---------- */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --fs-code: 14.5px; --fs-body: 14px; }
    #home { gap: 8px; padding-top: 8px; padding-bottom: 8px; }
    #home h1 { font-size: 17px; }
    #hand { font-size: 13px; padding: 4px 14px; min-height: 34px; }
    #grid { gap: 8px; }
    .tile { border-radius: 14px; border-left-width: 6px; padding: 6px 8px; min-height: 0; }
    .tile b { font-size: 16px; }
    .tile span { font-size: 11px; margin-top: 3px; }
    #unit { padding-top: 6px; padding-bottom: 72px; }
    #uHead { margin-bottom: 6px; column-gap: 14px; }
    #uHead h2 { font-size: 17px; border-left-width: 5px; padding-left: 8px; }
    .legend { font-size: 11px; }
    #uHead .sub { display: none; }
    #zoom button { min-width: 44px; height: 30px; font-size: 14px; }
    #sections { gap: 8px; }
    .card { padding: 8px 10px; border-radius: 10px; }
    .card h3 { font-size: 15px; margin-bottom: 4px; }
    pre { padding: 6px 10px; line-height: 1.38; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .k { padding: 0 2px; border-radius: 3px; }
    ul.notes { margin-top: 4px; }
    ul.notes li { margin: 0; }
    #fab { gap: 8px; }
    #fab button { height: 44px; min-width: 44px; border-radius: 22px; font-size: 20px; opacity: .92; }
    #fab #goHome { padding: 0 16px; font-size: 15px; }
  }

</style>
</head>
<body>

<main id="home">
  <header>
    <h1>Web 筆記 · 重點架構</h1>
    <button id="hand" aria-label="切換慣用手"></button>
  </header>
  <div id="rotate">建議將裝置橫放使用</div>
  <div id="grid"></div>
</main>

<main id="unit" hidden>
  <div id="uHead"><h2 id="uTitle"></h2>
  <p class="legend"><span class="k">黃底</span> 必背關鍵語法　<span class="v">藍字</span> 可替換的值／名稱　<span class="c">灰字</span> 註解</p>
  <span id="zoom"><button id="zOut" aria-label="程式碼字體縮小">A−</button><b id="zVal"></b><button id="zIn" aria-label="程式碼字體放大">A+</button></span></div>
  <div id="sections"></div>
</main>

<nav id="fab" hidden>
  <button id="prev" aria-label="上一單元">‹</button>
  <button id="goHome">⌂ 主頁</button>
  <button id="next" aria-label="下一單元">›</button>
</nav>

<script>
/* 標記：⟦…⟧ = 關鍵語法（黃底） ⟨…⟩ = 可替換的值（藍字） 註解自動變灰 */
const UNITS = [
{
  id: 'animation', title: 'Animation', sub: 'setInterval / clearInterval / random', color: '#ff7a90',
  sections: [
    { h: '動畫骨架：開始 / 停止', code: `
var ⟨animationSchedule⟩;        // 全域變數，停止時要用

// 開始：指定 1.做什麼(函式)  2.多久一次(毫秒)
function startAnimation() {
  ⟨animationSchedule⟩ = ⟦setInterval(⟧⟨animationFunction⟩, ⟨1000⟩⟦)⟧;
}

// 停止
function stopAnimation() {
  ⟦clearInterval(⟧⟨animationSchedule⟩⟦)⟧;
}

<button ⟦onClick⟧="startAnimation()">Start</button>
<button onClick="stopAnimation()">Stop</button>`, notes: [
      '⟦setInterval⟧ 第一個參數是⟦函式名稱，不加 ()⟧',
    ]},
    { h: 'Counter：每秒 +1', code: `
var ⟨counter⟩ = 0;
var counterSchedule;

function startCounterAnimation() {
  counterSchedule = ⟦setInterval⟧(⟨showCounter⟩, 1000);
}

function ⟨showCounter⟩() {
  counter = counter ⟦+ 1⟧;                       // 更新
  var counterSpan = document.⟦getElementById⟧("counter");
  counterSpan.⟦innerHTML⟧ = counter;             // 顯示
}

<span ⟦id⟧="counter"></span>`, notes: [] },
    { h: 'Dice：跑 N 次後自動停', code: `
var rollDiceSchedule;
var ⟨rollDiceCounter⟩;

function rollDiceAnimation() {
  ⟨rollDiceCounter⟩ ⟦= 0⟧;                         // 先歸零
  rollDiceSchedule = setInterval(rollDice, ⟨100⟩);
}

function rollDice() {
  var diceValue = ⟦Math.floor(Math.random() * ⟧⟨6⟩⟦) + 1⟧;
  var imageFile = "dice" + diceValue + ".png";
  document.getElementById("dice").⟦src⟧ = imageFile;

  rollDiceCounter = rollDiceCounter + 1;
  ⟦if (rollDiceCounter == ⟧⟨10⟩⟦)⟧ {
    ⟦clearInterval⟧(rollDiceSchedule);            // 到次數就停
  }
}`, notes: ['用 ⟦counter 變數⟧ 判斷何時停止動畫'] },
    { h: 'Random 公式', code: `
⟦Math.random()⟧                          // 小數 0 ≤ x < 1
Math.random() * 10                     // 小數 0 ~ 10
⟦Math.floor(⟧Math.random() * 10⟦)⟧         // 整數 0 ~ 9
Math.floor(Math.random() * 10) ⟦+ 1⟧     // 整數 1 ~ 10

// 陣列隨機挑一個（Slideshow）
var index = Math.floor(Math.random() * ⟨image_list⟩⟦.length⟧);
imgElement.src = image_list⟦[index]⟧;`, notes: ['整數 1~N：⟦Math.floor(Math.random() * N) + 1⟧'] },
    { h: 'Clock：顯示現在時間', code: `
function showClock() {
  var now = ⟦new Date()⟧;
  var clock = now.⟦getHours()⟧ + ":" + now.⟦getMinutes()⟧
            + ":" + now.⟦getSeconds()⟧;
  document.getElementById("clock").innerHTML = clock;
}
clockAnimation = setInterval(showClock, 1000);`, notes: [] },
  ]
},
{
  id: 'cssjs', title: 'CSS with JS', sub: 'style / Transition / Transform', color: '#e88bd9',
  sections: [
    { h: '用 JS 改樣式：三步驟', code: `
// Step 1：給要改的元素一個 ID
<span ⟦id⟧="⟨hello⟩">Hello world</span>

// Step 2：取得元素
var e = document.⟦getElementById(⟧"⟨hello⟩"⟦)⟧;

// Step 3：改樣式   e.style.[cssProperty] = "值"
e.⟦style⟧.color = "pink";
e.⟦style⟧.fontSize = "25px";
e.⟦style⟧.fontStyle = "italic";`, notes: ['值一律是⟦字串⟧，單位（px）要自己寫'] },
    { h: 'CSS 連字號 → JS 駝峰', code: `
font-size            →  e.style.⟦fontSize⟧
font-style           →  e.style.⟦fontStyle⟧
background-color     →  e.style.⟦backgroundColor⟧
border-bottom-style  →  e.style.⟦borderBottomStyle⟧
border-left-color    →  e.style.⟦borderLeftColor⟧
padding-right        →  e.style.⟦paddingRight⟧`, notes: ['去掉 ⟦-⟧，後面那個字的⟦第一個字母大寫⟧'] },
    { h: '範例：依輸入改文字樣式', code: `
<input type="text" id="colorInput" />
<input type="text" id="fontSizeInput" />
<button ⟦onClick⟧="changeStyle();">Change style</button>
<span id="hello">Hello world</span>

function changeStyle() {
  // get user input from text fields
  var colorValue    = document.getElementById("colorInput")⟦.value⟧;
  var fontSizeValue = document.getElementById("fontSizeInput")⟦.value⟧;

  // change color and font size
  var helloSpan = document.getElementById("hello");
  helloSpan.⟦style.color⟧    = colorValue;
  helloSpan.⟦style.fontSize⟧ = fontSizeValue;
}`, notes: [] },
    { h: '範例：圖片透明度 / 段落樣式', code: `
// 數字要先轉型
var opacityValue = ⟦Number(⟧opacityField.value⟦)⟧;
image.style.⟦opacity⟧ = opacityValue;

// 段落
cityPar.style.⟦fontSize⟧        = fontSize;
cityPar.style.⟦padding⟧         = padding;
cityPar.style.⟦color⟧           = color;
cityPar.style.⟦backgroundColor⟧ = bgColor;
cityPar.style.⟦borderStyle⟧     = border;`, notes: [] },
    { h: 'CSS Transition', code: `
.trans1 {
  background-color: mediumblue;                /* 開始狀態 */
  ⟦transition-property⟧: ⟨background-color⟩;     /* 必填：改哪個屬性 */
  ⟦transition-duration⟧: ⟨3s⟩;                   /* 必填：多久 */
  ⟦transition-timing-function⟧: ⟨ease-in-out⟩;   /* 加速方式 */
  ⟦transition-delay⟧: ⟨1s⟩;                      /* 開始前停多久 */
}
.trans1⟦:hover⟧ {
  background-color: red;                       /* 結束狀態 */
}`, notes: ['需要⟦開始狀態＋結束狀態⟧；結束狀態由 ⟦:hover⟧、⟦:focus⟧、⟦:active⟧ 觸發（又稱 tweening）'] },
    { h: 'Transition 簡寫', code: `
/* transition: property duration timing-function delay; */
.trans2 {
  background-color: green;
  ⟦transition⟧: ⟨background-color⟩ ⟨3s⟩ ⟨ease-in-out⟩ ⟨1s⟩;
}
.trans2:hover, .trans2⟦:focus⟧ {
  background-color: blue;
}

timing-function： ⟦ease⟧  ⟦linear⟧  ⟦ease-in⟧  ⟦ease-out⟧  ⟦ease-in-out⟧`, notes: [] },
    { h: 'CSS Transform', code: `
#myDiv {
  ⟦transform⟧: ⟦skew(⟧20deg⟦)⟧;              /* 一載入就是變形狀態 */
}
#myDiv⟦:hover⟧ {
  transform: skew(20deg) ⟦scale(⟧1.5⟦)⟧;   /* 多個函式用空白串接 */
}
img:hover {
  transform: ⟦rotate(⟧-50deg⟦)⟧;           /* 互動時才變形 */
}

2D 函式： ⟦rotate()⟧  ⟦translate()⟧  ⟦scale()⟧  ⟦skew()⟧`, notes: ['Transform 可以⟦旋轉、移動、縮放、傾斜⟧元素；角度單位是 ⟦deg⟧'] },
  ]
},
{
  id: 'events', title: 'JS Events', sub: 'onClick / onChange / confirm', color: '#9ad36a',
  sections: [
    { h: 'Event 骨架', code: `
<button ⟦onClick⟧="⟨handlerFunction1()⟩">Click me</button>
<span ⟦onMouseOver⟧="⟨handlerFunction2()⟩">some text</span>

<script>
function ⟨handlerFunction1⟩() {
  alert("…");          // 事件發生時要做的事
}
<\/script>`, notes: ['在 HTML 元素上寫 ⟦on事件="函式()"⟧ 屬性；事件發生時函式被執行'] },
    { h: '事件一覽', code: `
⟦onClick⟧      點擊元素（button、img、checkbox、radio…）
⟦onLoad⟧       資源⟦完全載入後⟧
⟦onFocus⟧      元素取得焦點（進入欄位）
⟦onBlur⟧       元素失去焦點（離開欄位）
⟦onChange⟧     失去焦點⟦而且值有改變⟧
⟦onSelect⟧     選取（反白）欄位裡的文字
⟦onSubmit⟧     送出表單
⟦onMouseDown⟧ / ⟦onMouseUp⟧     按下 / 放開滑鼠鍵
⟦onMouseOver⟧ / ⟦onMouseOut⟧    滑鼠移入 / 移出`, notes: ['Focus / Blur / Change 用在 ⟦input⟧、⟦textarea⟧、⟦select⟧'] },
    { h: 'onLoad', code: `
<script>
function greeting() {
  alert("Welcome to my website!");
}
<\/script>

<⟦body⟧ ⟦onLoad⟧="greeting()">`, notes: ['⟦<body>⟧：整頁內容（圖片、JS、CSS）都載完才觸發；⟦<img>⟧：圖片取回後觸發'] },
    { h: 'onChange', code: `
Enter discount code:
<input type="text" ⟦id⟧="discountCode" ⟦onChange⟧="uppercase()">

function uppercase() {
  var discountField = document.getElementById("discountCode");
  discountField⟦.value⟧ = discountField.value⟦.toUpperCase()⟧;
}`, notes: ['進入欄位但⟦沒改內容⟧就離開、或下拉選了⟦同一個選項⟧ → 不會觸發'] },
    { h: 'Mouse events', code: `
<span id="demo" ⟦onMouseDown⟧="mouseDown()" ⟦onMouseUp⟧="mouseUp()">
Mouse Events
</span>

function mouseDown() {
  var demoSpan = document.getElementById("demo");
  demoSpan.innerHTML = "Release Me";
}
function mouseUp() {
  var demoSpan = document.getElementById("demo");
  demoSpan.innerHTML = "Thank You";
}

<span id="demo" ⟦onMouseOver⟧="mouseOver()" ⟦onMouseOut⟧="mouseOut()">`, notes: [] },
    { h: 'onSubmit（表單驗證）', code: `
<form ⟦onSubmit⟧="⟦return⟧ validateForm()" action="..." method="...">
  ...
</form>

function validateForm() {
  if (... something wrong ...) {
    ⟦return false⟧;     // 不送出
  }
  ⟦return true⟧;        // 送到 server
}`, notes: [] },
    { h: 'Confirm box', code: `
var ok = ⟦confirm(⟧"Do you want to proceed?"⟦)⟧;

if (ok) {
  alert("User clicked OK");         // OK     → ⟦true⟧
} else {
  alert("User clicked Cancel.");    // Cancel → ⟦false⟧
}`, notes: [] },
    { h: 'Prompt box', code: `
// prompt("sometext", "defaultText")
var name = ⟦prompt(⟧"Please enter your name", "⟨cat in the hat⟩"⟦)⟧;

if (name ⟦!= null⟧) {
  alert("Hello " + name);           // OK     → ⟦輸入的值⟧
} else {
  alert("You clicked Cancel");      // Cancel → ⟦null⟧
}`, notes: ['三種對話框：⟦alert⟧ 只顯示、⟦confirm⟧ 回傳 true/false、⟦prompt⟧ 回傳字串或 null'] },
  ]
},
{
  id: 'form', title: 'Form Validation', sub: '表單驗證', color: '#ffb347',
  sections: [
    { h: '骨架', code: `
<form ⟦action⟧="⟨myService⟩" ⟦method⟧="⟨get⟩"
      ⟦onSubmit⟧="⟦return⟧ ⟨validateForm()⟩">
  ... your form goes here ...
  <input type="⟦submit⟧" value="Submit">
</form>

<script>
function ⟨validateForm⟩() {
  if (... something wrong ...) {
    ⟦return false⟧;      // 表單不會送出
  }
  ⟦return true⟧;
}
<\/script>`, notes: [
      '⟦onSubmit="return …"⟧ 的 ⟦return⟧ 不能少',
    ]},
    { h: '必填檢查 + 錯誤訊息', code: `
<input type="text" ⟦id⟧="⟨email⟩" name="email">
<span ⟦id⟧="⟨emailError⟩" style="color:red"></span>

function validateForm() {
  var email = document.⟦getElementById⟧("⟨email⟩")⟦.value⟧;

  if (email ⟦== null⟧ || email⟦.trim() == ""⟧) {
    document.getElementById("⟨emailError⟩").⟦innerHTML⟧ =
        "Email must be filled out";
    ⟦return false⟧;
  }
  return true;
}`, notes: [
      '⟦trim()⟧ 去掉字串兩側空白 → 擋掉只輸入空白的情況',
    ]},
    { h: '修正：通過時清掉舊訊息', code: `
if (email == null || email.trim() == "") {
  document.getElementById("emailError").innerHTML =
      "Email must be filled out";
  return false;
} ⟦else⟧ {

function makeAjaxQuery() {
  // create an XMLHttpRequest
  var xhttp = ⟦new XMLHttpRequest()⟧;

  // create a handler for the readyState change
  xhttp.⟦onreadystatechange⟧ = ⟦function() {⟧
    readyStateChangeHandler(xhttp);
  ⟦};⟧

  // making query by async call
  xhttp.⟦open(⟧"⟨GET⟩", "⟨weather.json⟩", ⟨true⟩⟦)⟧;

}`, notes: ['⟦open⟧ 第三個參數 ⟨true⟩ ＝ 非同步 (async)'] },
    { h: 'Callback：判斷成功 / 失敗', code: `
function readyStateChangeHandler(xhttp) {
  if (xhttp.⟦readyState == 4⟧) {        // 4 = DONE
    if (xhttp.⟦status == 200⟧) {        // 200 = OK
      handleStatusSuccess(xhttp);
    } else {
      handleStatusFailure(xhttp);
    }
  }
}

function handleStatusFailure(xhttp) {
  var displayDiv = document.getElementById("display");
  displayDiv.innerHTML =
      "XMLHttpRequest failed: status " + xhttp⟦.status⟧;
}`, notes: [] },

  var jsonText = xhttp.⟦responseText⟧;        // Step 2

   └─ <body>
      ├─ <h1> ── Text: "Hello World"
      └─ <p>  ── Text: "Wollongong"`, notes: [
      'DOM 把網頁結構表示成記憶體中的一棵⟦樹⟧',
    ]},
    { h: '選取元素', code: `
document.⟦getElementById(⟧⟨id⟩⟦)⟧                // 一個元素
document.⟦getElementsByTagName(⟧⟨tagName⟩⟦)⟧     // 多個
document.⟦getElementsByClassName(⟧⟨className⟩⟦)⟧ // 多個`, notes: ['get⟦Elements⟧…（有 s）回傳集合，要用 ⟦[i]⟧ 取出'] },
    { h: '建立元素三步驟', code: `
// 1 建立元素
var li = document.⟦createElement(⟧"⟨li⟩"⟦)⟧;

// 2 建立文字節點，放進元素
var personText = document.⟦createTextNode(⟧⟨personInfo⟩⟦)⟧;
li.⟦appendChild(⟧personText⟦)⟧;

// 3 把元素加到頁面上既有的元素
var personUL = document.getElementById("personList");
personUL.⟦appendChild(⟧li⟦)⟧;

<ul id="personList"></ul>`, notes: [
      '⟦createElement → createTextNode → appendChild → appendChild⟧',
    ]},
    { h: '刪除 / 取代 / 屬性', code: `
⟨parent⟩.⟦removeChild(⟧⟨element⟩⟦)⟧;
⟨parent⟩.⟦replaceChild(⟧⟨new⟩, ⟨old⟩⟦)⟧;         // 順序：新, 舊

element.⟦getAttribute(⟧⟨attrName⟩⟦)⟧;
element.⟦setAttribute(⟧⟨attrName⟩, ⟨attrValue⟩⟦)⟧;`, notes: ['講義寫作 ⟦document.removeChild(element)⟧；實際是由父節點呼叫'] },
    { h: '範例：依輸入動態加元素', code: `
function addElement() {
  // get tag name and text from user
  var tag  = document.getElementById("tagInput")⟦.value⟧;
  var text = document.getElementById("textInput")⟦.value⟧;

  // create a new element holding the text
  var element  = document.createElement(⟨tag⟩);
  var textNode = document.createTextNode(⟨text⟩);
  element.appendChild(textNode);

  // add the new element to the div
  var holderDiv = document.getElementById("elementHolder");
  holderDiv.appendChild(element);
}`, notes: [] },
    { h: '改內容三步驟（複習）', code: `
// 1 給元素 id   2 取得元素   3 改內容
var e = document.getElementById("⟨the-id⟩");

e.⟦innerHTML⟧ = "the-new-content";   // span, div …
e.⟦value⟧     = "the-new-value";     // input
e.⟦src⟧       = "the-new-image-src"; // img
e.⟦style⟧.color = "pink";            // 樣式`, notes: [] },
  ]
},
{
  id: 'css', title: 'CSS Selectors', sub: 'simple / class / id / contextual', color: '#ffd84d',
  sections: [

⟦p⟧ {
  border: 1px solid black;

⟦h1, h2⟧ {                 /* 逗號：h1 和 h2 都套用 */

<p ⟦class⟧="⟨userInfo⟩">…</p>

    { h: 'Contextual selector', code: `
⟦E F⟧   { … }      /* E 的每個⟦後代⟧ (descendant) F */
⟦E > F⟧ { … }      /* E 的每個⟦子元素⟧ (child) F     */

⟦div i⟧     → 兩個 <i> 都套用
⟦div > i⟧   → 只有第一個 <i>`, notes: [] },

a⟦:link⟧    { … }      /* 還沒點過的連結 */

h1⟦:hover⟧  { … }      /* 滑鼠移到上面時 */

/* 表單驗證 / transition 用到的 */
input⟦:invalid⟧   input⟦:valid⟧   input⟦:focus⟧
⟦:required⟧   ⟦:optional⟧   ⟦:disabled⟧   ⟦:active⟧`, notes: [] },

/* ---------- 渲染 ---------- */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&(?!amp;|lt;|gt;|quot;|apos;)/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function mark(s) {
  return s.replace(/⟦([\s\S]*?)⟧/g, '<span class="k">$1</span>')
          .replace(/⟨([\s\S]*?)⟩/g, '<span class="v">$1</span>');
}
function renderCode(src) {
  let s = esc(src.replace(/^\n/, ''));
  s = s.replace(/&lt;!--[\s\S]*?--&gt;/g, m => '<span class="c">' + m + '</span>')
       .replace(/\/\*[\s\S]*?\*\//g, m => '<span class="c">' + m + '</span>')
       .replace(/(^|\s)(\/\/.*)$/gm, (m, a, b) => a + '<span class="c">' + b + '</span>');
  return mark(s);
}

$('grid').innerHTML = UNITS.map(u =>
  '<button class="tile" style="--c:' + u.color + '" data-id="' + u.id + '"><b>' + u.title + '</b><span>' + u.sub + '</span></button>'
).join('');
$('grid').addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (t) location.hash = t.dataset.id;
});

function show() {
  const id = location.hash.slice(1);
  const i = UNITS.findIndex(u => u.id === id);
  const inUnit = i >= 0;
  $('home').hidden = inUnit;
  $('unit').hidden = !inUnit;
  $('fab').hidden = !inUnit;
  if (!inUnit) return;
  const u = UNITS[i];
  $('unit').style.setProperty('--c', u.color);
  $('uTitle').innerHTML = u.title + '<small><span class="sub">' + u.sub + '　</span>' + (i + 1) + ' / ' + UNITS.length + '</small>';
  $('sections').innerHTML = u.sections.map(s =>
    '<section class="card"><h3>' + s.h + '</h3><pre>' + renderCode(s.code) + '</pre>' +
    (s.notes.length ? '<ul class="notes">' + s.notes.map(n => '<li>' + mark(esc(n)) + '</li>').join('') + '</ul>' : '') +
    '</section>'
  ).join('');
  $('prev').onclick = () => location.hash = UNITS[(i - 1 + UNITS.length) % UNITS.length].id;
  $('next').onclick = () => location.hash = UNITS[(i + 1) % UNITS.length].id;
  window.scrollTo(0, 0);
}
$('goHome').onclick = () => { location.hash = ''; };
window.addEventListener('hashchange', show);

/* 慣用手切換：決定浮動按鈕在左或右 */
function setHand(left) {
  document.body.classList.toggle('left', left);
  $('hand').textContent = left ? '🖐 左手模式' : '右手模式 🖐';
  try { localStorage.setItem('hand', left ? 'L' : 'R'); } catch (e) {}
}
/* 程式碼字體大小：A− / A+，記在這台裝置上 */
let zoom = 1;
try { zoom = parseFloat(localStorage.getItem('zoom')) || 1; } catch (e) {}
function setZoom(z) {
  zoom = Math.min(1.8, Math.max(0.7, Math.round(z * 10) / 10));
  document.documentElement.style.setProperty('--zoom', zoom);
  $('zVal').textContent = Math.round(zoom * 100) + '%';
  try { localStorage.setItem('zoom', zoom); } catch (e) {}
}
$('zOut').onclick = () => setZoom(zoom - 0.1);
$('zIn').onclick = () => setZoom(zoom + 0.1);
setZoom(zoom);

$('hand').onclick = () => setHand(!document.body.classList.contains('left'));
let saved = 'R';
try { saved = localStorage.getItem('hand') || 'R'; } catch (e) {}
setHand(saved === 'L');
show();
</script>
