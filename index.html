<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Web 筆記</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1d2229;
    --line: #2e3540;
    --text: #e8ecf1;
    --dim: #8b96a5;
    --key-bg: #ffd84d;
    --key-fg: #1a1400;
    --val: #5fd7ff;
    --cmt: #7c8a78;
    --accent: #ffd84d;
    --fs-code: clamp(18px, 2.1vw, 24px);
    --fs-body: clamp(18px, 2vw, 22px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: var(--fs-body); line-height: 1.5;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  /* ---------- 主頁 ---------- */
  #home {
    height: 100dvh; display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    gap: 12px;
  }
  #home header { display: flex; align-items: center; justify-content: space-between; }
  #home h1 { margin: 0; font-size: clamp(20px, 2.6vw, 30px); letter-spacing: .04em; }
  #hand {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; font-size: 16px; color: var(--dim); min-height: 44px;
  }
  #grid {
    flex: 1; min-height: 0; display: grid; gap: 12px;
    grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr);
  }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    border-left: 8px solid var(--c);
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    padding: 10px 16px; text-align: left; min-height: 84px;
    transition: transform .08s, background .08s;
  }
  .tile:active { transform: scale(.97); background: #262d36; }
  .tile b { font-size: clamp(20px, 2.5vw, 32px); line-height: 1.2; }
  .tile span { font-size: clamp(14px, 1.5vw, 18px); color: var(--dim); margin-top: 6px; }
  #rotate { display: none; text-align: center; color: var(--dim); font-size: 15px; }

  @media (orientation: portrait) {
    #home { height: auto; min-height: 100dvh; }
    #grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: none; grid-auto-rows: 110px; }
    #rotate { display: block; }
  }

  /* ---------- 單元頁 ---------- */
  #unit {
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             120px max(16px, env(safe-area-inset-left));
  }
  #unit > h2 {
    margin: 0 0 12px; font-size: clamp(24px, 3vw, 36px);
    border-left: 8px solid var(--c, var(--accent)); padding-left: 14px;
  }
  #unit > h2 small { font-size: .55em; color: var(--dim); font-weight: 400; margin-left: 12px; }
  #sections { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; min-width: 0; }
  .card h3 { margin: 0 0 8px; font-size: clamp(19px, 2.2vw, 25px); color: var(--accent); }
  pre {
    margin: 0; padding: 12px 14px; background: #0f1216; border-radius: 12px;
    font: var(--fs-code)/1.55 "SF Mono", Menlo, Consolas, monospace;
    overflow-x: auto; white-space: pre; tab-size: 2;
  }
  .k { background: var(--key-bg); color: var(--key-fg); border-radius: 5px; padding: 0 4px; font-weight: 700; }
  .v { color: var(--val); font-weight: 700; }
  .c { color: var(--cmt); }
  .c .k { opacity: .9; }
  ul.notes { margin: 10px 0 0; padding-left: 1.2em; }
  ul.notes li { margin: 4px 0; }
  ul.notes .k, ul.notes .v { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .95em; }
  .legend { color: var(--dim); font-size: 15px; margin: 0 0 12px; }

  /* ---------- 浮動操作鈕（拇指區） ---------- */
  #fab {
    position: fixed; bottom: max(14px, env(safe-area-inset-bottom));
    right: max(14px, env(safe-area-inset-right));
    display: flex; gap: 10px; align-items: center; z-index: 10;
  }
  body.left #fab { right: auto; left: max(14px, env(safe-area-inset-left)); flex-direction: row-reverse; }
  #fab button {
    height: 64px; min-width: 64px; border-radius: 32px;
    background: #2b333e; border: 1px solid #465060;
    font-size: 26px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  #fab #goHome { background: var(--accent); color: #1a1400; border-color: var(--accent); padding: 0 26px; font-size: 22px; }
  #fab button:active { transform: scale(.94); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<main id="home">
  <header>
    <h1>Web 筆記 · 重點架構</h1>
    <button id="hand" aria-label="切換慣用手"></button>
  </header>
  <div id="rotate">建議將裝置橫放使用</div>
  <div id="grid"></div>
</main>

<main id="unit" hidden>
  <h2 id="uTitle"></h2>
  <p class="legend"><span class="k">黃底</span> 必背關鍵語法　<span class="v">藍字</span> 可替換的值／名稱　<span class="c">灰字</span> 註解</p>
  <div id="sections"></div>
</main>

<nav id="fab" hidden>
  <button id="prev" aria-label="上一單元">‹</button>
  <button id="goHome">⌂ 主頁</button>
  <button id="next" aria-label="下一單元">›</button>
</nav>

<script>
/* 標記：⟦…⟧ = 關鍵語法（黃底） ⟨…⟩ = 可替換的值（藍字） 註解自動變灰 */
const UNITS = [
{
  id: 'animation', title: 'Animation', sub: 'CSS 動畫 / transition', color: '#ff7a90',
  sections: [
    { h: '@keyframes + animation', code: `
⟦@keyframes⟧ ⟨move⟩ {
  ⟦from⟧ { left: 0;     opacity: 1; }
  ⟦to⟧   { left: 300px; opacity: 0; }
}
/* 或用百分比 */
@keyframes ⟨move⟩ {
  ⟦0%⟧ {…}  ⟦50%⟧ {…}  ⟦100%⟧ {…}
}

.box {
  position: relative;
  ⟦animation-name⟧: ⟨move⟩;
  ⟦animation-duration⟧: ⟨2s⟩;
  ⟦animation-iteration-count⟧: ⟨infinite⟩;
}`, notes: [
      '名稱要對上：⟦@keyframes⟧ 的名字 = ⟦animation-name⟧',
      '沒寫 ⟦animation-duration⟧ 預設 0s → 不會動',
    ]},
    { h: 'animation 屬性一覽', code: `
animation-⟦delay⟧: 1s;             /* 延遲開始 */
animation-⟦timing-function⟧: ⟨ease⟩; /* linear | ease-in | ease-out | ease-in-out */
animation-⟦direction⟧: ⟨alternate⟩;  /* normal | reverse | alternate */
animation-⟦fill-mode⟧: ⟨forwards⟩;   /* 停在最後一格 */
animation-⟦play-state⟧: ⟨paused⟩;    /* running | paused */

/* 簡寫：name duration timing delay count direction */
⟦animation⟧: ⟨move 2s linear 1s infinite alternate⟩;`, notes: [] },
    { h: 'transition（狀態改變時過渡）', code: `
.btn {
  width: 100px;
  ⟦transition⟧: ⟨width⟩ ⟨0.5s⟩ ⟨ease⟩;  /* 屬性 時間 曲線 */
}
.btn⟦:hover⟧ { width: 200px; }

/* 常搭配 transform */
⟦transform⟧: ⟨translate(50px,0)⟩ ⟨rotate(45deg)⟩ ⟨scale(1.5)⟩;`, notes: [
      '⟦transition⟧ 需要觸發（:hover、改 class）；⟦animation⟧ 可自動播放',
    ]},
    { h: 'JavaScript 動畫', code: `
var x = 0;
var timer = ⟦setInterval⟧(frame, ⟨10⟩);   // 每 10ms
function frame() {
  if (x >= 300) { ⟦clearInterval⟧(timer); }
  else { x++; box.⟦style.left⟧ = x + ⟦"px"⟧; }
}

// 較順的寫法
function step() {
  x++; box.style.left = x + "px";
  ⟦requestAnimationFrame⟧(step);
}
requestAnimationFrame(step);`, notes: ['記得加單位 ⟦"px"⟧，元素要 ⟦position⟧: relative / absolute'] },
  ]
},
{
  id: 'form', title: 'Form Validation', sub: '表單驗證', color: '#ffb347',
  sections: [
    { h: '表單骨架', code: `
<form ⟦name⟧="⟨myForm⟩"
      ⟦action⟧="⟨process.php⟩"
      ⟦method⟧="⟨get⟩"
      ⟦onsubmit⟧="⟦return⟧ ⟨validate()⟩">

  <input type="text" ⟦name⟧="⟨fname⟩" ⟦id⟧="⟨fname⟩">
  <span id="err"></span>

  <input type="⟦submit⟧" value="Submit">
</form>`, notes: [
      '⟦onsubmit="return …"⟧ 的 ⟦return⟧ 不能少，否則 false 也會送出',
      '⟦action⟧＝送去哪裡；⟦method⟧＝⟨get⟩（資料在網址）/ ⟨post⟩（資料在 body）',
    ]},
    { h: '驗證函式', code: `
function ⟨validate⟩() {
  var x = ⟦document.forms⟧["⟨myForm⟩"]["⟨fname⟩"]⟦.value⟧;
  // 或 document.getElementById("fname").value

  if (x ⟦== ""⟧) {
    alert("Name must be filled out");
    ⟦return false⟧;     // 擋下，不送出
  }
  if (⟦isNaN⟧(x) || x < 1 || x > 10) {
    document.getElementById("err").⟦innerHTML⟧ = "1~10";
    ⟦return false⟧;
  }
  ⟦return true⟧;        // 通過，送出
}`, notes: ['⟦return false⟧ → 不送出；⟦return true⟧ → 送到 action'] },
    { h: '正規表示式檢查', code: `
var re = ⟦/^⟧⟨[A-Za-z0-9._]+@[A-Za-z0-9.]+\\.[a-z]{2,}⟩⟦$/⟧;
if (!re⟦.test(⟧email⟦)⟧) { return false; }

// ^ 開頭  $ 結尾  \\d 數字  \\w 英數底線  \\s 空白
// +  1個以上   *  0個以上   ?  0或1個   {2,5} 次數
// [abc] 其中之一   [^abc] 排除   (a|b) 或`, notes: [] },
    { h: 'HTML5 內建驗證屬性', code: `
<input type="text"   ⟦required⟧>
<input type="⟦email⟧">
<input type="⟦number⟧" ⟦min⟧="1" ⟦max⟧="10">
<input type="text"   ⟦pattern⟧="⟨[A-Za-z]{3}⟩" title="三個字母">
<input type="text"   ⟦maxlength⟧="10" ⟦placeholder⟧="…">

// JS 檢查
if (!input.⟦checkValidity()⟧) {
  msg.innerHTML = input.⟦validationMessage⟧;
}`, notes: ['<form ⟦novalidate⟧> 可關閉瀏覽器內建驗證'] },
  ]
},
{
  id: 'xsd', title: 'XSD', sub: 'XML Schema', color: '#c792ea',
  sections: [
    { h: 'Schema 骨架 (.xsd)', code: `
<?xml version="1.0"?>
<⟦xs:schema⟧ ⟦xmlns:xs⟧="⟦http://www.w3.org/2001/XMLSchema⟧">

  <⟦xs:element⟧ name="⟨note⟩">
    <⟦xs:complexType⟧>
      <⟦xs:sequence⟧>
        <xs:element ⟦name⟧="⟨to⟩"   ⟦type⟧="⟨xs:string⟩"/>
        <xs:element name="⟨body⟩" type="xs:string"/>
      </xs:sequence>
    </xs:complexType>
  </xs:element>

</xs:schema>`, notes: [
      '有子元素或屬性 → ⟦complexType⟧；只有文字 → simple element',
      '⟦xs:sequence⟧ 依序、⟦xs:all⟧ 不限順序、⟦xs:choice⟧ 擇一',
    ]},
    { h: 'XML 文件引用 XSD', code: `
<?xml version="1.0"?>
<⟨note⟩
  ⟦xmlns:xsi⟧="⟦http://www.w3.org/2001/XMLSchema-instance⟧"
  ⟦xsi:noNamespaceSchemaLocation⟧="⟨note.xsd⟩">
  <to>Tove</to>
  <body>Hi</body>
</note>`, notes: ['有 namespace 時改用 ⟦xsi:schemaLocation⟧="⟨命名空間 檔案⟩"'] },
    { h: '型別、次數、屬性', code: `
<!-- 常用型別 -->
⟦xs:string⟧  ⟦xs:integer⟧  ⟦xs:decimal⟧  ⟦xs:boolean⟧  ⟦xs:date⟧

<!-- 出現次數（預設都是 1） -->
<xs:element name="item" type="xs:string"
            ⟦minOccurs⟧="⟨0⟩" ⟦maxOccurs⟧="⟨unbounded⟩"/>

<!-- 預設值 / 固定值 -->
<xs:element name="color" type="xs:string" ⟦default⟧="red"/>
<xs:element name="color" type="xs:string" ⟦fixed⟧="red"/>

<!-- 屬性：寫在 sequence 之後 -->
<⟦xs:attribute⟧ name="⟨id⟩" type="xs:integer" ⟦use⟧="⟨required⟩"/>`, notes: ['⟦xs:attribute⟧ 要放在 complexType 內、⟦</xs:sequence>⟧ 的後面'] },
    { h: 'Restriction（限制值）', code: `
<xs:element name="⟨age⟩">
  <⟦xs:simpleType⟧>
    <⟦xs:restriction⟧ ⟦base⟧="⟨xs:integer⟩">
      <⟦xs:minInclusive⟧ value="0"/>
      <⟦xs:maxInclusive⟧ value="120"/>
    </xs:restriction>
  </xs:simpleType>
</xs:element>

<!-- 其他 facet -->
<⟦xs:enumeration⟧ value="⟨Audi⟩"/>     <!-- 列舉 -->
<⟦xs:pattern⟧ value="⟨[a-z]{3}⟩"/>     <!-- 正規式 -->
<⟦xs:length⟧ value="8"/>  <xs:⟦minLength⟧ …/>  <xs:⟦maxLength⟧ …/>`, notes: [] },
  ]
},
{
  id: 'json', title: 'JSON', sub: '語法 / parse / stringify', color: '#7fd67f',
  sections: [
    { h: 'JSON 語法', code: `
⟦{⟧
  ⟦"name"⟧: "John",          // key 一定要⟦雙引號⟧
  "age": 30,                // number
  "married": true,          // boolean
  "car": null,              // null
  "address": ⟦{⟧ "city": "Taipei" ⟦}⟧,        // object
  "pets": ⟦[⟧ "dog", "cat" ⟦]⟧                // array
⟦}⟧`, notes: [
      '值的型別：string、number、object、array、boolean、null',
      '不可以有：⟦函式⟧、⟦undefined⟧、⟦註解⟧、單引號、結尾逗號',
    ]},
    { h: '字串 ⇄ 物件', code: `
// 字串 → JS 物件（收到資料時）
var obj = ⟦JSON.parse(⟧text⟦)⟧;

// JS 物件 → 字串（送出資料時）
var text = ⟦JSON.stringify(⟧obj⟦)⟧;`, notes: ['伺服器傳來的一律是字串，要先 ⟦JSON.parse⟧ 才能用 . 取值'] },
    { h: '取值與走訪', code: `
obj⟦.⟧name            obj⟦["name"]⟧
obj.address⟦.⟧city    obj.pets⟦[0]⟧

// 走訪物件
⟦for (var k in obj)⟧ { k → key   obj⟦[k]⟧ → value }

// 走訪陣列
for (var i = 0; i < obj.pets⟦.length⟧; i++) { obj.pets[i] }

// 修改 / 刪除
obj.age = 31;      ⟦delete⟧ obj.car;`, notes: [] },
    { h: 'JSON 搭配 AJAX', code: `
var xhr = new XMLHttpRequest();
xhr.onreadystatechange = function () {
  if (this.readyState == 4 && this.status == 200) {
    var data = ⟦JSON.parse(this.responseText)⟧;
    document.getElementById("demo").innerHTML = data.name;
  }
};
xhr.open("GET", "⟨data.json⟩", true);
xhr.send();`, notes: ['JSON vs XML：JSON 較短、可用陣列、直接 parse 成 JS 物件'] },
  ]
},
{
  id: 'xml', title: 'XML and DTD', sub: 'well-formed / valid', color: '#5fd7ff',
  sections: [
    { h: 'XML 骨架', code: `
⟦<?xml version="1.0" encoding="UTF-8"?>⟧
<⟨bookstore⟩>                         <!-- 唯一 root -->
  <book ⟦category="web"⟧>             <!-- 屬性值要引號 -->
    <title>Learning XML</title>
    <price>39.95</price>

</⟨bookstore⟩>`, notes: [
      'Well-formed：⟦單一 root⟧、⟦標籤要關閉⟧、⟦大小寫一致⟧、⟦正確巢狀⟧、⟦屬性值加引號⟧',
      '特殊字元：⟦&amp;lt;⟧ <　⟦&amp;gt;⟧ >　⟦&amp;amp;⟧ &　⟦&amp;quot;⟧ "　⟦&amp;apos;⟧ \'',
      'Valid ＝ well-formed ＋ 符合 DTD / XSD',
    ]},
    { h: '內部 DTD', code: `
<?xml version="1.0"?>
⟦<!DOCTYPE⟧ ⟨note⟩ ⟦[⟧

    { h: '外部 DTD', code: `

    { h: 'ELEMENT 規則', code: `
<!ELEMENT br ⟦EMPTY⟧>             <!-- 空元素 -->
<!ELEMENT x  ⟦ANY⟧>               <!-- 任意內容 -->

⟦<!ATTLIST⟧ ⟨元素⟩ ⟨屬性⟩ ⟨型別⟩ ⟨預設⟩>

  ]
},
{
  id: 'ajax', title: 'AJAX', sub: 'XMLHttpRequest / fetch', color: '#ff9e64',
  sections: [
    { h: 'GET 骨架（四步驟）', code: `
function loadDoc() {
  var xhr = ⟦new XMLHttpRequest()⟧;               // 1 建立

  xhr.⟦onreadystatechange⟧ = function () {        // 2 回呼
    if (this.⟦readyState == 4⟧ && this.⟦status == 200⟧) {
      document.getElementById("demo").innerHTML =
        this.⟦responseText⟧;
    }
  };

  xhr.⟦open(⟧"⟨GET⟩", "⟨data.txt⟩", ⟨true⟩⟦)⟧;        // 3 設定
  xhr.⟦send()⟧;                                   // 4 送出
}`, notes: [
      '⟦open(method, url, async)⟧：第三個參數 ⟨true⟩ = 非同步',
      'AJAX = 不重新載入整頁，就能跟伺服器交換資料',
    ]},
    { h: 'readyState / status', code: `
⟦readyState⟧
  0  尚未 open        1  已 open
  2  已 send          3  接收中
  ⟦4  完成⟧

⟦status⟧
  ⟦200⟧  OK      403  Forbidden      ⟦404⟧  Not Found

// 也可以用 onload（不用檢查 readyState）
xhr.⟦onload⟧ = function () { this.responseText };`, notes: [] },
    { h: 'POST', code: `
xhr.open("⟦POST⟧", "⟨demo.php⟩", true);
xhr.⟦setRequestHeader⟧("⟦Content-type⟧",

/* ---------- 渲染 ---------- */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&(?!amp;|lt;|gt;|quot;|apos;)/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function mark(s) {
  return s.replace(/⟦([\s\S]*?)⟧/g, '<span class="k">$1</span>')
          .replace(/⟨([\s\S]*?)⟩/g, '<span class="v">$1</span>');
}
function renderCode(src) {
  let s = esc(src.replace(/^\n/, ''));
  s = s.replace(/&lt;!--(?! |$)|&lt;!--[\s\S]*?--&gt;/g, m => m.endsWith('--&gt;') ? '<span class="c">' + m + '</span>' : m)
       .replace(/\/\*[\s\S]*?\*\//g, m => '<span class="c">' + m + '</span>')
       .replace(/(^|\s)(\/\/.*)$/gm, (m, a, b) => a + '<span class="c">' + b + '</span>');
  return mark(s);
}

$('grid').innerHTML = UNITS.map(u =>
  '<button class="tile" style="--c:' + u.color + '" data-id="' + u.id + '"><b>' + u.title + '</b><span>' + u.sub + '</span></button>'
).join('');
$('grid').addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (t) location.hash = t.dataset.id;
});

function show() {
  const id = location.hash.slice(1);
  const i = UNITS.findIndex(u => u.id === id);
  const inUnit = i >= 0;
  $('home').hidden = inUnit;
  $('unit').hidden = !inUnit;
  $('fab').hidden = !inUnit;
  if (!inUnit) return;
  const u = UNITS[i];
  $('unit').style.setProperty('--c', u.color);
  $('uTitle').innerHTML = u.title + '<small>' + u.sub + '　' + (i + 1) + ' / ' + UNITS.length + '</small>';
  $('sections').innerHTML = u.sections.map(s =>
    '<section class="card"><h3>' + s.h + '</h3><pre>' + renderCode(s.code) + '</pre>' +
    (s.notes.length ? '<ul class="notes">' + s.notes.map(n => '<li>' + mark(esc(n)) + '</li>').join('') + '</ul>' : '') +
    '</section>'
  ).join('');
  $('prev').onclick = () => location.hash = UNITS[(i - 1 + UNITS.length) % UNITS.length].id;
  $('next').onclick = () => location.hash = UNITS[(i + 1) % UNITS.length].id;
  window.scrollTo(0, 0);
}
$('goHome').onclick = () => { location.hash = ''; };
window.addEventListener('hashchange', show);

/* 慣用手切換：決定浮動按鈕在左或右 */
function setHand(left) {
  document.body.classList.toggle('left', left);
  $('hand').textContent = left ? '🖐 左手模式' : '右手模式 🖐';
  try { localStorage.setItem('hand', left ? 'L' : 'R'); } catch (e) {}
}
$('hand').onclick = () => setHand(!document.body.classList.contains('left'));
let saved = 'R';
try { saved = localStorage.getItem('hand') || 'R'; } catch (e) {}
setHand(saved === 'L');
show();
</script>
